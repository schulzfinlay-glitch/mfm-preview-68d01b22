  <rect x="20" y="8" width="4" height="48" rx="2" fill="currentColor"/>
  <path d="M24 10h24a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H33l-9 7V10z" fill="currentColor"/>
  <circle cx="33" cy="22" r="2.4" fill="var(--mfm-mark-dot, #f3eee3)"/>
  <circle cx="40" cy="22" r="2.4" fill="var(--mfm-mark-dot, #f3eee3)"/>
  <circle cx="47" cy="22" r="2.4" fill="var(--mfm-mark-dot, #f3eee3)"/>
</svg>
